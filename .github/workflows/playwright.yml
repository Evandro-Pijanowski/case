name: CI/CD - Playwright-Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t playwright-api-tests .

      - name: Run tests
        run: docker run --rm playwright-api-tests

      - name: Upload logs
        uses: actions/upload-artifact@v3
        with:
          name: playwright-logs
          path: logs